[package]
name = "coffee-cli-mobile"
version = "0.1.0"
description = "Coffee CLI on a phone: the desktop UI, connected to a paired computer"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

# Its own package, not part of the desktop build: the phone runs only the remote UI and the
# connection relay, none of the desktop's terminals, tools or window plumbing.
[workspace]

[lib]
name = "coffee_cli_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
serde_json = "1"
base64 = "0.22.1"
url = "2"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

