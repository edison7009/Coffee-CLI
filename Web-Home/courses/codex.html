<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="../icons/icon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Codex Agent Course - Coffee 101. Coming soon.">
  <title>Codex Course | Coffee 101</title>

  <link rel="stylesheet" href="../css/style.css?v=0.8.2">
  <link rel="stylesheet" href="../css/courses.css?v=1.0.0">

  <link rel="preload" href="../fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>

  <header class="navbar">
    <a href="/" class="logo" style="text-decoration:none;">
      <svg class="dynamic-brand-logo" width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M8 2.5c-.8.8-.8 1.7 0 2.5M12 2.5c-.8.8-.8 1.7 0 2.5M16 2.5c-.8.8-.8 1.7 0 2.5"/><path fill="currentColor" d="M4.5 8.5h12v7a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4z"/><path d="M16.5 10h1.5a2.5 2.5 0 0 1 0 5h-1.5"/></g>
      </svg>
      <span>Coffee 101</span>
    </a>
    <nav class="course-tabs"></nav>
    <nav class="nav-links">
      <button class="icon-switch" id="theme-toggle" aria-label="Toggle Theme">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="theme-icon"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
      </button>
      <button class="lang-switch" id="lang-toggle">English / 中文</button>
    </nav>
  </header>

  <main class="course-placeholder">
    <div class="placeholder-content">
      <h1 id="placeholder-title">Codex</h1>
      <p id="placeholder-msg">Course under development...</p>
      <a href="claude-code.html" class="placeholder-link" id="placeholder-link">&larr; Back to Claude Code Course</a>
    </div>
  </main>

  <script>
  (function() {
    // Theme toggle
    const theme = localStorage.getItem("coffee-cli-theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
    const themeBtn = document.getElementById("theme-toggle");
    if (themeBtn) {
      themeBtn.addEventListener("click", () => {
        const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("coffee-cli-theme", next);
      });
    }

    // Language toggle
    const langToggle = document.getElementById("lang-toggle");
    let currentLang = localStorage.getItem("coffee-cli-lang") || (navigator.language.includes("zh") ? "zh" : "en");

    function updateLangUI() {
      document.documentElement.lang = currentLang;
      langToggle.textContent = currentLang === "en" ? "English / \u4e2d\u6587" : "\u4e2d\u6587 / English";
      document.getElementById("placeholder-msg").textContent = currentLang === "zh"
        ? "\u8bfe\u7a0b\u6b63\u5728\u5f00\u53d1\u4e2d..."
        : "Course under development...";
      document.getElementById("placeholder-link").innerHTML = currentLang === "zh"
        ? "&larr; \u8fd4\u56de Claude Code \u8bfe\u7a0b"
        : "&larr; Back to Claude Code Course";
    }

    updateLangUI();

    if (langToggle) {
      langToggle.addEventListener("click", () => {
        currentLang = currentLang === "en" ? "zh" : "en";
        localStorage.setItem("coffee-cli-lang", currentLang);
        updateLangUI();
      });
    }
  })();
  </script>

  <script src="../js/course-tabs.js?v=1.0.1"></script>
</body>
</html>
