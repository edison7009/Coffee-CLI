<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page not found — Coffee CLI</title>
  <link rel="icon" type="image/x-icon" href="/icons/icon.ico">
  <!-- Its presence also stops Cloudflare Pages from answering missing files
       with index.html (SPA fallback), which got cached under /css and /js. -->
  <style>
    :root { color-scheme: light dark; --fg: #18181a; --muted: #71717a; --bg: #fff; --brand: #c4956a; }
    @media (prefers-color-scheme: dark) { :root { --fg: #ebebeb; --muted: #888; --bg: #0e0e0f; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; text-align: center; padding: 0 16px; }
    h1 { font-size: 4rem; margin: 0; color: var(--brand); letter-spacing: -0.03em; }
    p { color: var(--muted); line-height: 1.8; margin: 0.6rem 0 1.4rem; }
    a { display: inline-block; margin: 0 0.4rem; color: var(--fg); text-decoration: none; border: 1px solid rgba(127,127,127,0.3);
      border-radius: 6px; padding: 6px 14px; font-size: 0.9rem; }
    a:hover { border-color: var(--brand); color: var(--brand); }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>This page doesn't exist.<br>页面不存在。</p>
    <a href="/">Home</a><a href="/docs/">Docs</a><a href="/zh/">中文首页</a><a href="/zh/docs/">中文文档</a>
  </main>
</body>
</html>
