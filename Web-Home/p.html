<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Shared prompt — Coffee CLI</title>
  <meta property="og:title" content="A prompt shared from Coffee CLI">
  <meta property="og:description" content="Open it in Coffee CLI or copy it. Nothing runs until you press Send.">
  <link rel="icon" type="image/x-icon" href="/icons/icon.ico">
  <!-- Prompt links (src-ui/src/lib/prompt-link.ts → coffeecli://new, parsed in src/launch.rs).
       Self-contained on purpose: no /css or /js file, so no ?v= to bump. The prompt only ever
       becomes a draft; this page never sends or runs anything. -->
  <style>
    :root { color-scheme: light dark; --fg: #18181a; --muted: #71717a; --bg: #fafaf9; --card: #fff; --line: rgba(127,127,127,0.25);
      --brand: #c4956a; --brand-fg: #fff; --warn: #b45309; --warn-bg: rgba(245,158,11,0.12); }
    @media (prefers-color-scheme: dark) { :root { --fg: #ebebeb; --muted: #8a8a8f; --bg: #0e0e0f; --card: #17171a; --warn: #fbbf24; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); padding: 48px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { max-width: 680px; margin: 0 auto; }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
    header img { width: 28px; height: 28px; }
    header a { color: var(--fg); text-decoration: none; font-weight: 600; }
    h1 { font-size: 1.4rem; margin: 0 0 6px; letter-spacing: -0.01em; }
    .sub { color: var(--muted); margin: 0 0 20px; line-height: 1.6; font-size: 0.95rem; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    .tool { display: inline-block; font-size: 0.8rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px;
      padding: 2px 10px; margin-bottom: 10px; }
    pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 0.92rem/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      max-height: 50vh; overflow: auto; }
    .note { margin: 14px 0 0; padding: 10px 12px; border-radius: 8px; font-size: 0.88rem; line-height: 1.6; background: var(--warn-bg); color: var(--warn); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    button, .btn { font: inherit; font-size: 0.95rem; cursor: pointer; border-radius: 8px; padding: 10px 18px; text-decoration: none;
      border: 1px solid var(--line); background: transparent; color: var(--fg); }
    button:hover, .btn:hover { border-color: var(--brand); color: var(--brand); }
    button.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-fg); }
    button.primary:hover { filter: brightness(1.06); color: var(--brand-fg); }
    .hint { color: var(--muted); font-size: 0.85rem; line-height: 1.6; margin: 14px 0 0; min-height: 1.4em; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <header><img src="/icons/favicon.svg" alt=""><a href="/">Coffee CLI</a></header>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
    <div class="card" id="card">
      <span class="tool" id="tool" hidden></span>
      <pre id="prompt"></pre>
    </div>
    <p class="note" id="note" hidden></p>
    <div class="actions" id="actions">
      <button class="primary" id="open" type="button"></button>
      <button id="copy" type="button"></button>
      <a class="btn" id="download" href="/"></a>
    </div>
    <p class="hint" id="hint" role="status"></p>
  </main>
  <script>
    (function () {
      var zh = /^zh/i.test(navigator.language || '');
      var tw = /^zh-(tw|hk|mo|hant)/i.test(navigator.language || '');
      var S = zh ? (tw ? {
        title: '有人和你分享了一段提示詞', sub: '在 Coffee CLI 中開啟後，它會出現在輸入框裡。你確認後按傳送才會執行。',
        open: '在 Coffee CLI 中開啟', copy: '複製提示詞', copied: '已複製', download: '下載 Coffee CLI', tool: '建議工具：',
        hidden: '這段提示詞裡有看不見的字元，已經移除。這類字元可能藏著指令，請先讀一遍再用。',
        inapp: '目前的 App 不能直接開啟 Coffee CLI。點右上角「…」選擇在瀏覽器開啟，或者先複製提示詞。',
        noApp: '沒有反應？可能還沒安裝 Coffee CLI，或版本太舊。請下載或更新到最新版，也可以直接複製提示詞。',
        bad: '這個連結沒有可用的提示詞', badSub: '連結可能不完整，或提示詞超過 8000 字。'
      } : {
        title: '有人和你分享了一段提示词', sub: '在 Coffee CLI 中打开后，它会出现在输入框里。你确认后按发送才会执行。',
        open: '在 Coffee CLI 中打开', copy: '复制提示词', copied: '已复制', download: '下载 Coffee CLI', tool: '建议工具：',
        hidden: '这段提示词里有看不见的字符，已经移除。这类字符可能藏着指令，请先读一遍再用。',
        inapp: '当前 App 不能直接打开 Coffee CLI。点右上角「…」选择在浏览器打开，或者先复制提示词。',
        noApp: '没有反应？可能还没安装 Coffee CLI，或版本太旧。请下载或更新到最新版，也可以直接复制提示词。',
        bad: '这个链接没有可用的提示词', badSub: '链接可能不完整，或提示词超过 8000 字。'
      }) : {
        title: 'Someone shared a prompt with you', sub: 'Open it in Coffee CLI and it appears in the input box. Nothing runs until you press Send.',
        open: 'Open in Coffee CLI', copy: 'Copy prompt', copied: 'Copied', download: 'Download Coffee CLI', tool: 'Suggested tool: ',
        hidden: 'This prompt contained invisible characters, which were removed. They can hide instructions, so read it before you use it.',
        inapp: "This app can't open Coffee CLI. Use the … menu to open the page in your browser, or copy the prompt.",
        noApp: "Nothing happened? Coffee CLI may not be installed, or it's out of date. Download or update it, or copy the prompt.",
        bad: 'This link has no usable prompt', badSub: 'The link may be cut off, or the prompt is longer than 8,000 characters.'
      };
      if (zh) document.documentElement.lang = tw ? 'zh-Hant' : 'zh-CN';
      var $ = function (id) { return document.getElementById(id); };

      // Same rule as src/launch.rs and src-ui/src/lib/prompt-link.ts.
      var HIDDEN = /[\u00AD\u034F\u061C\u115F\u1160\u17B4\u17B5\u180B-\u180F\u200B\u200C\u200E\u200F\u202A-\u202E\u2060-\u206F\u3164\uFEFF\uFFA0\uFFF0-\uFFFB\u{1D173}-\u{1D17A}\u{E0000}-\u{E0FFF}\u0000-\u0008\u000B-\u001F\u007F-\u009F]/gu;
      var params = new URLSearchParams(location.search);
      var raw = (params.get('prompt') || '').replace(/\r\n/g, '\n');
      var prompt = raw.replace(HIDDEN, '');
      var tool = params.get('tool') || '';
      if (!/^[a-z0-9][a-z0-9-]{0,40}$/.test(tool)) tool = '';

      $('download').textContent = S.download;
      if (!prompt.trim() || Array.from(prompt).length > 8000) {
        $('title').textContent = S.bad;
        $('sub').textContent = S.badSub;
        $('card').hidden = true;
        $('open').hidden = true;
        $('copy').hidden = true;
        return;
      }
      document.title = S.title + ' — Coffee CLI';
      $('title').textContent = S.title;
      $('sub').textContent = S.sub;
      $('prompt').textContent = prompt;
      if (tool) { $('tool').textContent = S.tool + tool; $('tool').hidden = false; }
      if (prompt !== raw) { $('note').textContent = S.hidden; $('note').hidden = false; }
      $('open').textContent = S.open;
      $('copy').textContent = S.copy;

      var inApp = /MicroMessenger|QQ\/|aweme|Weibo|DingTalk|Lark|XiaoHongShu|xhsdiscover|BytedanceWebview/i.test(navigator.userAgent);
      if (inApp) $('hint').textContent = S.inapp;

      var link = 'coffeecli://new?prompt=' + encodeURIComponent(prompt) + (tool ? '&tool=' + encodeURIComponent(tool) : '');
      $('open').addEventListener('click', function () {
        if (inApp) { $('hint').textContent = S.inapp; return; }
        var left = false;
        var away = function () { left = true; };
        window.addEventListener('blur', away, { once: true });
        document.addEventListener('visibilitychange', away, { once: true });
        location.href = link;
        setTimeout(function () { if (!left) $('hint').textContent = S.noApp; }, 1800);
      });

      $('copy').addEventListener('click', function () {
        var done = function () { $('copy').textContent = S.copied; setTimeout(function () { $('copy').textContent = S.copy; }, 1800); };
        var fallback = function () {
          var ta = document.createElement('textarea');
          ta.value = prompt; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
          document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); done(); } catch (e) { /* the prompt stays selectable on the page */ }
          document.body.removeChild(ta);
        };
        if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(prompt).then(done, fallback);
        else fallback();
      });
    })();
  </script>
</body>
</html>
