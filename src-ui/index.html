<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Coffee CLI — Your Multi-Agent AI Terminal Companion." />
    <title>Coffee CLI</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Preload bundled Inter weights so the browser warms its font cache during
         startup. Without this, Inter loads lazily the first time a glyph in its
         range is needed for paint — most visibly when the language menu opens
         (Cyrillic "Русский", Vietnamese "Tiếng Việt", and the glyph badges hit
         characters not yet seen elsewhere). The lazy load + font-display: swap
         caused a visible font jitter as rows reflowed from system fallback to
         Inter. Each weight is ~22KB local, so preloading all four costs ~90KB
         of startup bandwidth (zero on disk-loaded Tauri WebView2) in exchange
         for jitter-free first paint anywhere Inter is used. -->
    <link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/inter-500.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/inter-600.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/inter-700.woff2" as="font" type="font/woff2" crossorigin>
    <!-- Apply theme + shape BEFORE React renders to prevent flash of unstyled variables -->
    <script>
      (function() {
        var theme = 'obsidian';
        var mode = 'dark';
        var shape = 'basalt';
        try { theme = localStorage.getItem('cc-theme') || 'obsidian'; } catch(e) {}
        // Palettes retired in v3.5.4 (the redundant mid row) — mirror of
        // RETIRED_THEMES in src/store/app-state.tsx. A retired code has no
        // [data-theme] block left to match, so without this the pre-paint parks
        // an unknown attribute on <html> and the window paints with no palette
        // at all until React migrates the value.
        var retired = {
          cappuccino: 'obsidian', crimson: 'slate', sunset: 'dark',
          emerald: 'moss', cobalt: 'indigo', fuchsia: 'teal',
        };
        if (retired[theme]) theme = retired[theme];
        // cc-mode is new in v3.5.4; a saved 'light' theme from before it means
        // the user was on the day half of that family (mirrors app-state.tsx).
        try {
          mode = localStorage.getItem('cc-mode') || '';
          if (mode !== 'light' && mode !== 'dark' && mode !== 'system') {
            mode = theme === 'light' ? 'light' : 'dark';
          }
        } catch(e) {}
        if (mode === 'system') {
          mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        try { shape = localStorage.getItem('cc-shape') || 'basalt'; } catch(e) {}
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-mode', mode);
        // Frost renders as glass chrome + a data-frost backdrop variant
        // (mirrors App.tsx's shape effect) — pre-paint so no first-render flash.
        if (shape === 'frost') {
          document.documentElement.setAttribute('data-frost', shape);
          shape = 'glass';
        }
        if (shape === 'characters' || shape === 'basalt') {
          document.documentElement.setAttribute('data-background', shape);
          shape = 'carbon';
        }
        document.documentElement.setAttribute('data-shape', shape);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
