name: Review

on:
  push:
    branches: [main]
    paths-ignore: ['Web-Home/**', 'README*', 'docs/**', 'install/release-notes-template.md']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The open-source core on its own: what every contributor's pull request can build.
  core:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          key: review-core
      - name: Core check
        run: cargo check --locked
      - name: Core static analysis
        run: cargo clippy --locked --all-targets -- -D clippy::correctness -D clippy::suspicious
      - name: Core regression tests
        run: cargo test --locked --no-fail-fast

  # The app as it ships, with the private Pro modules (tool integrations and the interface). Only runs where the
  # deploy key is available: pushes and pull requests from this repository, never pull requests from forks.
  frontend:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Check out Pro
        uses: actions/checkout@v5
        with:
          repository: edison7009/Coffee-CLI-secret-
          ref: main
          path: pro
          ssh-key: ${{ secrets.PRO_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pro/ui/package-lock.json
      - name: Build, lint, and regression tests
        working-directory: pro/ui
        run: |
          npm ci
          npm run build
          npm run lint
          npm test
          npm audit --audit-level=high --omit=dev
      - name: Install test browser
        working-directory: pro/ui
        run: npx playwright install --with-deps --only-shell chromium
      - name: Browser interaction regression tests
        working-directory: pro/ui
        run: npm run test:browser

  native:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, macos-15-intel, ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Check out Pro
        uses: actions/checkout@v5
        with:
          repository: edison7009/Coffee-CLI-secret-
          ref: main
          path: pro
          ssh-key: ${{ secrets.PRO_DEPLOY_KEY }}
          persist-credentials: false
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          key: review-${{ matrix.platform }}
      - name: Native check
        run: cargo check --locked --features pro
      - name: Native static analysis
        run: cargo clippy --locked --all-targets --features pro -- -D clippy::correctness -D clippy::suspicious
      - name: Native regression tests
        run: cargo test --locked --no-fail-fast --features pro
