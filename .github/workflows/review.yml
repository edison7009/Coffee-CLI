name: Review

on:
  push:
    branches: [main]
    paths-ignore: ['Web-Home/**', 'README*', 'docs/**', 'install/release-notes-template.md']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src-ui/package-lock.json
      - name: Build, lint, and regression tests
        working-directory: src-ui
        run: |
          npm ci
          npm run build
          npm run lint
          npm test
          npm audit --audit-level=high --omit=dev
      - name: Install test browser
        working-directory: src-ui
        run: npx playwright install --with-deps --only-shell chromium
      - name: Browser interaction regression tests
        working-directory: src-ui
        run: npm run test:browser

  native:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, macos-15-intel, ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          key: review-${{ matrix.platform }}
      - name: Native check
        run: cargo check --locked
      - name: Native static analysis
        run: cargo clippy --locked --all-targets --all-features -- -D clippy::correctness -D clippy::suspicious
      - name: Native regression tests
        run: cargo test --locked --no-fail-fast
