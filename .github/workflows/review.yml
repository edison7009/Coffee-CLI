name: Review

# This repository holds no source. Review is a build check of the private desktop source
# (edison7009/Coffee-CLI-secret-), run here where Actions minutes are free: Actions → Review → Run workflow.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of the private desktop source to check
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: review-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out desktop source
        uses: actions/checkout@v5
        with:
          repository: edison7009/Coffee-CLI-secret-
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.PRO_DEPLOY_KEY }}
          persist-credentials: false
      # The website, for the tests that check the desktop against it.
      - name: Check out website
        uses: actions/checkout@v5
        with:
          path: public
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pro/ui/package-lock.json
      - name: Build, lint, and regression tests
        working-directory: pro/ui
        env:
          COFFEE_WEB_HOME: ${{ github.workspace }}/public/Web-Home
        run: |
          npm ci
          npm run build
          npm run lint
          npm test
          npm audit --audit-level=high --omit=dev
      - name: Install test browser
        working-directory: pro/ui
        run: npx playwright install --with-deps --only-shell chromium
      - name: Browser interaction regression tests
        working-directory: pro/ui
        run: npm run test:browser

  native:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, macos-15-intel, ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 40
    steps:
      - name: Check out desktop source
        uses: actions/checkout@v5
        with:
          repository: edison7009/Coffee-CLI-secret-
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.PRO_DEPLOY_KEY }}
          persist-credentials: false
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          key: review-${{ matrix.platform }}
      - name: Native check
        run: cargo check --locked
      - name: Core check without the Pro modules
        if: runner.os == 'Linux'
        run: cargo check --locked --no-default-features
      - name: Native static analysis
        run: cargo clippy --locked --all-targets -- -D clippy::correctness -D clippy::suspicious
      - name: Native regression tests
        run: cargo test --locked --no-fail-fast
