name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Quality gate ─────────────────────────────────────────────────────
  # Build and regression checks must pass before any platform is packaged.
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The private Pro modules (tool integrations and the interface), at the tag of the same name.
      - name: Check out Pro
        uses: actions/checkout@v5
        with:
          repository: edison7009/Coffee-CLI-secret-
          ref: ${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
          path: pro
          ssh-key: ${{ secrets.PRO_DEPLOY_KEY }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pro/ui/package-lock.json

      - name: Install frontend deps
        run: |
          cd pro/ui
          npm ci

      - name: Frontend build, lint, and regression tests
        run: |
          cd pro/ui
          npm run build
          npm run lint
          npm test
          npm audit --audit-level=high --omit=dev

      - name: Install test browser
        working-directory: pro/ui
        run: npx playwright install --with-deps --only-shell chromium

      - name: Browser interaction regression tests
        working-directory: pro/ui
        run: npm run test:browser

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Tauri's Linux build pulls glib-sys / gobject-sys / webkit2gtk-sys
      # crates, which pkg-config against the system dev libraries. The
      # release matrix installs these for the ubuntu builds; the quality
      # gate needs the SAME set or `cargo test` fails to compile the
      # glib-sys build script (glib-2.0.pc not found). Mirror the matrix's
      # install verbatim so the gate stays in lockstep with what actually
      # ships.
      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev patchelf

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: quality

      - name: Rust static analysis
        run: cargo clippy --locked --all-targets --features pro -- -D clippy::correctness -D clippy::suspicious

      # Unit tests — includes the shell_probe detection / fallback-chain
      # suite. On Linux this also exercises the Unix cfg branches that
      # Windows-hosted dev never runs locally (#[cfg(not(target_os =
      # "windows"))] tests are filtered out on Windows).
      - name: Cargo test
        run: cargo test --locked --no-fail-fast --features pro

      - name: Build native test host
        run: cargo build --locked --features pro

      - name: Native orchestration protocol regression
        working-directory: pro/ui
        env:
          COFFEE_TEST_EXE: ${{ github.workspace }}/target/debug/coffee-cli
        run: npm run test:native

  release:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            label: Windows x64
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            target: aarch64-apple-darwin
            label: macOS Apple Silicon
          # GitHub Actions exposed a dedicated x86_64 macOS runner
          # (`macos-15-intel`) in May 2026, after the `macos-13` Intel runner
          # was deprecated. Without it, Intel Mac users had to run Coffee CLI
          # under Rosetta from the arm64 DMG. Now we ship a native x64 DMG too.
          - platform: macos-15-intel
            args: '--target x86_64-apple-darwin'
            target: x86_64-apple-darwin
            label: macOS Intel
          - platform: ubuntu-22.04
            args: ''
            label: Linux x64
          - platform: ubuntu-22.04-arm
            args: ''
            label: Linux arm64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The private Pro modules (tool integrations and the interface), at the tag of the same name.
      - name: Check out Pro
        uses: actions/checkout@v5
        with:
          repository: edison7009/Coffee-CLI-secret-
          ref: ${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
          path: pro
          ssh-key: ${{ secrets.PRO_DEPLOY_KEY }}
          persist-credentials: false

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          # Tag-pushes give refs/tags/v1.2.3; workflow_dispatch falls back to
          # the latest tag in the working tree. Bare version (no leading "v")
          # is what tauri stamps into bundle filenames; both forms are
          # exposed for downstream steps.
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TAG" = "$GITHUB_REF" ]; then
            TAG=$(git describe --tags --abbrev=0)
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev patchelf rpm

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pro/ui/package-lock.json

      - name: Install frontend deps
        run: |
          cd pro/ui
          npm ci

      # All platforms build identically on stable xterm 6.0.0. The Linux CJK
      # IME punctuation-duplication bug (issue #37 / xtermjs#5374) is fixed in
      # the app layer instead — see TierTerminal.tsx (__IS_LINUX__-gated
      # suppression of xterm's composition events) — so there is no longer a
      # Linux-only dependency override or a Linux-only tsc-skip build path.
      - name: Build frontend (tsc + vite)
        run: |
          cd pro/ui
          npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}

      - name: Validate bundled terminal runtime (Windows)
        if: runner.os == 'Windows'
        run: node pro/ui/scripts/run-conpty-bundle-test.mjs

      - name: Native regression tests
        run: cargo test --locked --no-fail-fast --features pro ${{ matrix.args }}

      - name: Install Tauri CLI
        # Keep utils.nsh and our custom NSIS template on the same interface.
        run: cargo install tauri-cli --version "2.12.2" --locked

      # ── macOS ────────────────────────────────────────────────────────────
      # Tauri compiles and (when signing) signs the .app; scripts/macos-release.sh
      # does the rest: notarize + staple the .app, build the drag-to-install DMG
      # (dmgbuild, scripts/dmg-settings.py), sign + notarize + staple the DMG,
      # and check what users will download. See the script header.
      #
      # Signing is an explicit switch, not inferred from secrets, so a missing
      # or expired secret fails the release instead of quietly shipping an
      # unsigned DMG. Repository → Settings → Secrets and variables → Actions:
      #   variable COFFEE_MACOS_SIGNED = true
      #   secret   APPLE_CERTIFICATE           base64 of the Developer ID Application .p12
      #   secret   APPLE_CERTIFICATE_PASSWORD  the .p12 export password
      #   notarization, one of:
      #     APPLE_API_KEY + APPLE_API_ISSUER + APPLE_API_KEY_P8 (App Store Connect
      #       API key id, issuer id, and the .p8 file's text) — preferred
      #     APPLE_ID + APPLE_PASSWORD (app-specific password) + APPLE_TEAM_ID
      - name: Prepare Developer ID signing (macOS)
        if: runner.os == 'macOS' && vars.COFFEE_MACOS_SIGNED == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE:?COFFEE_MACOS_SIGNED is true but APPLE_CERTIFICATE is missing}"
          : "${APPLE_CERTIFICATE_PASSWORD:?APPLE_CERTIFICATE_PASSWORD is missing}"
          KEYCHAIN="$RUNNER_TEMP/coffee-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          (umask 077; printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12")
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # A .p12 carries only our certificate; codesign also needs Apple's
          # Developer ID G2 intermediate to build the chain to Apple's root.
          if curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"; then
            security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" || true
          else
            echo "::warning::could not download the Developer ID G2 intermediate; relying on the runner's copy"
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -nE 's/.*"(Developer ID Application: [^"]+)".*/\1/p' | head -1)
          if [ -z "$IDENTITY" ]; then
            echo "::error::APPLE_CERTIFICATE holds no 'Developer ID Application' identity"
            security find-identity -v -p codesigning "$KEYCHAIN"
            exit 1
          fi
          echo "Signing identity: $IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          # NOTARY_* rather than Tauri's APPLE_* names: Tauri then only signs,
          # and notarization runs (with retries) in scripts/macos-release.sh.
          if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            (umask 077; printf '%s\n' "$APPLE_API_KEY_P8" > "$KEY_PATH")
            {
              echo "NOTARY_KEY_ID=$APPLE_API_KEY"
              echo "NOTARY_ISSUER=$APPLE_API_ISSUER"
              echo "NOTARY_KEY_PATH=$KEY_PATH"
            } >> "$GITHUB_ENV"
          elif [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            {
              echo "NOTARY_APPLE_ID=$APPLE_ID"
              echo "NOTARY_PASSWORD=$APPLE_PASSWORD"
              echo "NOTARY_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
          else
            echo "::error::no notarization credentials (APPLE_API_KEY/APPLE_API_ISSUER/APPLE_API_KEY_P8 or APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID)"
            exit 1
          fi

      - name: Build .app (macOS)
        if: runner.os == 'macOS'
        run: cargo tauri build --bundles app --features pro --config pro/tauri.conf.json ${{ matrix.args }}

      - name: Notarize and build drag-to-install DMG (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 240  # a new team's first notarization can take hours
        env:
          COFFEE_MACOS_SIGNED: ${{ vars.COFFEE_MACOS_SIGNED == 'true' }}
        run: |
          bash scripts/macos-release.sh "${{ matrix.target }}" "${{ steps.tag.outputs.version }}" \
            "target/${{ matrix.target }}/release/bundle"

      # ── Windows / Linux: standard one-shot bundle build ──
      - name: Build all bundles (Windows / Linux)
        if: runner.os != 'macOS'
        run: cargo tauri build --features pro --config pro/tauri.conf.json ${{ matrix.args }}

      - name: Verify packaged orchestration protocol
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target || '' }}
        run: |
          EXE="$GITHUB_WORKSPACE/target/${BUILD_TARGET:+$BUILD_TARGET/}release/coffee-cli"
          if [ "$RUNNER_OS" = "Windows" ]; then EXE="$EXE.exe"; fi
          export COFFEE_TEST_EXE="$EXE"
          cd pro/ui
          npm run test:native

      # ── Stage + rename artifacts to platform-labelled format ──
      # Tauri's bundler emits names like `Coffee CLI_1.9.2_amd64.deb` which
      # don't tell the end user which OS they're for and use inconsistent
      # arch slugs (amd64/x86_64/x64 across formats, plus rpm's `-1` release
      # suffix). We rename to the EchoBird-style convention:
      #   Coffee.CLI_<version>_<OS>_<arch>.<ext>
      # so a glance at the GitHub Releases page makes the OS/arch obvious
      # and the install scripts have a single uniform pattern to grep.
      - name: Stage and rename artifacts
        id: stage
        shell: bash
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -e
          STAGING="$RUNNER_TEMP/coffee-release"
          mkdir -p "$STAGING"

          rename_one() {
            local src="$1"
            [ -f "$src" ] || return 0
            local base
            base=$(basename "$src")
            local out=""
            case "$base" in
              # Windows
              *_x64-setup.exe)        out="Coffee.CLI_${VERSION}_Windows_x64-setup.exe" ;;
              *_x64_*.msi|*_x64.msi)  out="Coffee.CLI_${VERSION}_Windows_x64.msi" ;;
              # macOS — separate native DMGs for Apple Silicon and Intel.
              # Tauri's bundler uses `aarch64` / `x64` suffixes on the dmg
              # name (matching the target triple's first segment).
              *_aarch64.dmg)          out="Coffee.CLI_${VERSION}_macOS_arm64.dmg" ;;
              *_x64.dmg)              out="Coffee.CLI_${VERSION}_macOS_x64.dmg" ;;
              # Linux .deb (Tauri uses Debian "amd64"/"arm64")
              *_amd64.deb)            out="Coffee.CLI_${VERSION}_Linux_x64.deb" ;;
              *_arm64.deb)            out="Coffee.CLI_${VERSION}_Linux_arm64.deb" ;;
              # Linux .AppImage (upstream AppImage uses "amd64"/"aarch64")
              *_amd64.AppImage)       out="Coffee.CLI_${VERSION}_Linux_x64.AppImage" ;;
              *_aarch64.AppImage)     out="Coffee.CLI_${VERSION}_Linux_arm64.AppImage" ;;
              # Linux .rpm (uses dot-separated `<name>-<ver>-<release>.<arch>.rpm`)
              *.x86_64.rpm)           out="Coffee.CLI_${VERSION}_Linux_x64.rpm" ;;
              *.aarch64.rpm)          out="Coffee.CLI_${VERSION}_Linux_arm64.rpm" ;;
              *) echo "  skip: $base"; return 0 ;;
            esac
            cp "$src" "$STAGING/$out"
            echo "  staged: $base  →  $out"
          }

          echo "Bundle scan roots:"
          for root in \
            target/release/bundle \
            target/aarch64-apple-darwin/release/bundle \
            target/x86_64-apple-darwin/release/bundle \
          ; do
            [ -d "$root" ] || continue
            echo "  $root"
            while IFS= read -r f; do
              rename_one "$f"
            done < <(find "$root" -type f \
              \( -name "*.exe" -o -name "*.msi" \
                 -o -name "*.dmg" \
                 -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) )
          done

          echo ""
          echo "Final staged assets:"
          ls -la "$STAGING"
          echo "staging=$STAGING" >> "$GITHUB_OUTPUT"

      # ── Create release if missing, then upload all staged artifacts ──
      # Each matrix job races to create the release; `gh release create`
      # fails idempotently if another job already created it (caught and
      # ignored), then `gh release upload --clobber` overwrites any
      # earlier-job placeholder of the same filename.
      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          TAG="${{ steps.tag.outputs.tag }}"
          STAGING="${{ steps.stage.outputs.staging }}"

          # Wait briefly in case another matrix job is mid-create.
          for i in 1 2 3 4 5 6; do
            if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              break
            fi
            echo "Release $TAG not yet present (attempt $i/6); waiting 10s..."
            sleep 10
          done

          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Creating release $TAG (draft)"
            # Releases are created as drafts so the maintainer can review CI
            # artifacts and edit the changelog before users see the new
            # version. Clicking "Publish release" in the GitHub UI fires the
            # release.published event consumed by
            # .github/workflows/bump-version-json.yml, which bumps
            # Web-Home/version.json on main → CF Pages redeploys → in-app
            # update check picks up the new version. Until then, in-app
            # users and install scripts still see the previous release.
            NOTES_FILE="$GITHUB_WORKSPACE/install/release-notes-template.md"
            if [ -f "$NOTES_FILE" ]; then
              gh release create "$TAG" --repo "${{ github.repository }}" \
                --draft \
                --title "Coffee CLI $TAG" \
                --notes-file "$NOTES_FILE" \
                || echo "Release already exists (created by sibling matrix job)"
            else
              gh release create "$TAG" --repo "${{ github.repository }}" \
                --draft \
                --title "Coffee CLI $TAG" \
                --notes "Coffee CLI $TAG. See README for install instructions." \
                || echo "Release already exists (created by sibling matrix job)"
            fi
          fi

          # Upload everything in staging. --clobber overwrites if a previous
          # job already pushed an asset with the same name.
          shopt -s nullglob
          for f in "$STAGING"/*; do
            echo "uploading: $(basename "$f")"
            gh release upload "$TAG" "$f" --repo "${{ github.repository }}" --clobber
          done
